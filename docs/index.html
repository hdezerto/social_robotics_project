<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Who Wants to Be a Furllionaire? Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #17191f;
        --muted: #626a78;
        --line: #d9dee7;
        --accent: #7b2f2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      header {
        display: grid;
        gap: 12px;
        margin-bottom: 28px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        max-width: 760px;
        font-size: clamp(2rem, 5vw, 3.75rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 760px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .video-frame {
        overflow: hidden;
        background: #101216;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 40px rgb(23 31 43 / 12%);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #101216;
      }

      .note {
        margin-top: 16px;
      }

      @media (max-width: 720px) {
        main {
          width: min(100% - 24px, 640px);
          padding-top: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="https://github.com/hdezerto/social_robotics_project">View repository</a>
        <h1>Who Wants to Be a Furllionaire?</h1>
        <p>
          Demo video for the Social Robotics project. The first part shows the reactive assistance mode;
          the second part shows the proactive assistance mode.
        </p>
      </header>

      <section aria-label="Demo video">
        <div class="video-frame">
          <video controls playsinline preload="metadata">
            <source src="media/social-robotics-demo.mp4" type="video/mp4">
          </video>
        </div>
        <p class="note">Audio is part of the interaction and should be enabled while watching.</p>
      </section>
    </main>
  </body>
</html>
